{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block titulo %}Alterar Senha | Exotika Brazil{% endblock %}

{% block conteudo %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white text-center py-3">
                <h5 class="mb-0 fw-bold"><i class="fa-solid fa-key text-warning me-2"></i>Alterar Senha</h5>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-warning fw-bold">
                            <i class="fa-solid fa-check me-1"></i> Salvar Nova Senha
                        </button>
                        <a href="{% url 'index' %}" class="btn btn-light border text-muted">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
