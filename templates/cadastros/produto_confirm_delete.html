{% extends 'base.html' %}
{% block titulo %}Excluir Produto | Exotika Brazil{% endblock %}
{% block conteudo %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card border-danger shadow-lg">
            <div class="card-header bg-danger text-white text-center"><h5>Confirmar Exclusão</h5></div>
            <div class="card-body text-center p-4">
                <p>Deseja excluir o produto <strong>"{{ object.nome }}"</strong>?</p>
                <form method="post">
                    {% csrf_token %}
                    <a href="{% url 'listar-produto' %}" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Excluir</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
